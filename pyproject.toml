[project]
name = "plumax"
version = "0.3.0"
description = "Differentiable, probabilistic plume transport and source inversion for any passive tracer (JAX)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "methane",
    "plume",
    "dispersion",
    "atmospheric-transport",
    "data-assimilation",
    "source-attribution",
    "emission-estimation",
    "jax",
    "bayesian-inference",
]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
]
# Core runtime deps — only what the forward models need. The NumPyro-based
# Bayesian inference modules are imported lazily; consumers who only want the
# xarray forward models do not pay for them. jax/jaxlib >= 0.10 tracks
# finitevolx (>= 0.0.42) and gaussx (>= 0.0.17), which moved to the jaxlib
# 0.10 line; numpyro >= 0.21 dropped the removed `xla_pmap_p` import and is
# compatible.
dependencies = [
    "jax>=0.10",
    "jaxlib>=0.10",
    # >= 2.0 for np.trapezoid (gauss_plume, gauss_puff, population).
    "numpy>=2.0",
    "xarray",
    # netcdf4 backs the compressed-NetCDF LUT round-trip in hapi_lut; without a
    # real engine xarray falls back to scipy, which rejects zlib/complevel.
    "netcdf4",
    "scipy>=1.11",
    # diffrax + equinox drive the gauss_puff time-varying wind solves.
    "diffrax>=0.6",
    "equinox>=0.11",
    # finitevolx powers the Arakawa C-grid FVM operators used by les_fvm.
    # >= 0.0.44 for the wall="open" lateral-BC mode (les_fvm needs it);
    # 0.0.45 is additive (masked reductions, spherical cell widths).
    "finitevolx>=0.0.45",
    # gaussx supplies the structured linear-algebra primitives (LowRankUpdate +
    # Woodbury solve) used by the radtran matched-filter retrieval. >= 0.0.17
    # for solve_tridiagonal, which the finitevolx >= 0.0.44 stack requires;
    # >= 0.0.25 for `symmetrize`, a reverse-mode-differentiable `safe_cholesky`,
    # and the state-space layer (MaternSDE / MarkovGaussian) Tier IV builds on.
    "gaussx>=0.6.5",
    # optimistix powers the variational retrieval module (assimilation):
    # LBFGS / GaussNewton / LevenbergMarquardt + implicit-adjoint gradients.
    "optimistix>=0.0.10",
    # pipekit-ops (import pipekit_ops) supplies the carrier-agnostic Operator
    # primitives, and pipekit_cycle the ForwardModel / ObservationOperator
    # protocols that the plumax operator + adapter layer plug into.
    "pipekit-ops>=0.2.3",
    # radtrax owns the radiative transfer (the single-slab forward model, the
    # SRF and the instrument) that the plume-to-radiance coupling in `coupled`
    # and the radiance adapter compose with the plume models (package
    # boundaries rule 2: plumax imports radtrax, never the reverse). 0.1.0 is
    # the first release with `radtrax.retrieval.absorption` (plumax.vetting).
    "radtrax>=0.1.0",
    # geophysix owns the physical constants and the closed-form gas maths
    # (ideal-gas number density, column-unit conversions) plumax used to copy.
    "geophysix>=0.0.7",
    # einx writes reductions, gathers and rearranges with named axes (the
    # house style's replacement for axis= / reshape / indexing tricks).
    "einx>=0.4",
    # integrix sums the IME and the cross-sectional flux (plumax#250) and owns
    # the log-space quadrature and the importance diagnostics (plumax#253).
    # 0.0.5 is the first release with rule.log_integrate,
    # expect.log_gauss_hermite / log_simpson, expect.effective_sample_size and
    # expect.pareto_smoothed_log_weights; 0.0.6 pins functax 0.0.11.
    "integrix>=0.0.6",
    # functax supplies the trapezoid rules that the column, POD and survival
    # integrals sum with on integrix (plumax#247); 0.0.11 is the release
    # integrix 0.0.6 pins.
    "functax>=0.0.11",
    # kernellib supplies the Matérn-3/2 kernel of the Tier II and Tier III
    # spatial priors and of the centreline prior (plumax#350). 0.0.22 is the
    # release with kernellib.functional.matern_kernel at nu = 1.5.
    "kernellib>=0.0.22",
]

[project.optional-dependencies]
# The `inference` submodules are the only consumers of numpyro.
inference = ["numpyro>=0.21"]
# Readers: WRF, ERA5, L2 products and inventories through xrops (xrtoolz-ops:
# the atmospheric column and height functions, the wrfout reader) and
# xrproducts (xrtoolz-products: the L2 and inventory openers), so the base
# install stays free of I/O stacks.
io = ["xrtoolz-ops", "xrtoolz-products", "pyproj"]
# Pulled in by the example notebooks (plots).
notebooks = ["matplotlib", "ipython"]
# Variational source inversion (Tier II OI, Tier III 3D-Var with a Laplace
# posterior) through vardax: plumax supplies the source-receptor map, vardax
# the analysis, and argminax the Laplace posterior at the MAP. Imported lazily,
# so the base install stays free of both.
assim = ["argminax", "vardax"]
# Footprint-emulator training (plumax.lagrangian.emulator) through pipekit-train:
# its SimulationDataset over the particle model, cached once by CachedDataset
# (zarr, the `cache` extra), and its TrainingLoop on the Equinox backend (optax,
# grain, orbax). Imported lazily, so the base install stays trainer-free.
emulate = ["pipekit-train[equinox,cache]"]
# Tier V point-process layer: plumax.population builds its generative and
# likelihood machinery on pyrox_xtreme.point_processes (Poisson, marked and
# thinned processes), imported lazily so `import plumax.population` stays light.
population = ["numpyro>=0.21", "pyyaml>=6", "pyrox-xtreme>=0.0.4"]
# Plume post-processing on GeoArrays (plumax.geo): the ten plume operators
# ported from geotoolz's `plume` (#134) and the vetting operator (#157), as
# pipekit Operators built with geoops's public carrier helpers; geoops's
# [morph] extra (scikit-image) measures skeleton lengths. georeader draws the
# contour polygons, and 2.4.1 imports typing_extensions and tqdm without
# declaring them; scikit-learn's DBSCAN counts clumps in PlumeQNDFeatures.
# Imported lazily, so the base install stays carrier-free (gate P5).
geo = [
    "functax>=0.0.11",
    "georeader-spaceml>=2.4.1",
    "geotoolz-ops[morph]>=0.18.1",
    "scikit-learn>=1.4",
    "tqdm>=4",
    "typing-extensions>=4",
]

[project.urls]
Repository = "https://github.com/jejjohnson/plumax"
Documentation = "https://jejjohnson.github.io/plumax"

[tool.uv]
# finitevolx and spectraldiffx carry their own `gaussx = { tag = "v0.0.17" }`
# source, which uv sees as a conflicting direct URL once plumax pins a newer
# rev. Force the whole graph onto plumax's gaussx (the pattern somax uses);
# every symbol those two packages import still exists at this rev.
override-dependencies = [
    "gaussx @ git+https://github.com/jejjohnson/gaussx@v0.6.12",
    # radtrax sources geonnax v0.0.9 and vardax (the `assim` extra) v0.0.10;
    # hold the graph on v0.0.10, which radtrax's geonnax imports still match.
    "geonnax @ git+https://github.com/jejjohnson/geonnax@v0.0.10",
    # vardax sources integrix v0.0.3; hold the graph on plumax's v0.0.6.
    "integrix @ git+https://github.com/jejjohnson/integrix@v0.0.6",
    # geoarray sources functax v0.0.6; hold the graph on integrix's v0.0.11.
    "functax @ git+https://github.com/jejjohnson/functax@v0.0.11",
]

# Unpublished sibling packages resolve from git; everything else from PyPI.
# Every source is pinned to a tag or rev so `uv lock --upgrade` cannot pull
# unreviewed upstream changes: pipekit has no tags yet (rev = its 0.0.2
# release commit); gaussx is pinned to the v0.6.12 tag (the one argminax
# v0.0.4 requires); radtrax to its v0.1.0
# tag (the first release, with `radtrax.retrieval.absorption`, which
# `plumax.vetting` needs; radtrax is not on PyPI).
# geonnax is radtrax's own git dependency, which uv does not read from
# radtrax's sources.
# pyrox-xtreme (the `population` extra) is not on PyPI and has no release tag
# in the pyrox workspace yet; it is pinned to the pyrox main commit that holds
# it (xtremax, its archived predecessor, moved there in jejjohnson/pyrox#463).
[tool.uv.sources]
# Every pipekit package is pinned to the one tag pipekit-array-v0.1.4 (30a6c19),
# which carries each package's current release; per-package tags make uv
# report conflicting URLs for pipekit-ops, which they all reference. geophysix
# and geotoolz pin that tag too, and geotoolz this geophysix tag, so the three
# move together.
pipekit-ops = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-ops", tag = "pipekit-array-v0.1.4" }
pipekit-array = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-array", tag = "pipekit-array-v0.1.4" }
pipekit-jax = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-jax", tag = "pipekit-array-v0.1.4" }
pipekit-experiment = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-experiment", tag = "pipekit-array-v0.1.4" }
finitevolx = { git = "https://github.com/jejjohnson/finitevolX", tag = "v0.0.45" }
pipekit-cycle = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-cycle", tag = "pipekit-array-v0.1.4" }
# pipekit-train (the `emulate` extra) is not on PyPI.
pipekit-train = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-train", tag = "pipekit-array-v0.1.4" }
gaussx = { git = "https://github.com/jejjohnson/gaussx", tag = "v0.6.12" }
radtrax = { git = "https://github.com/jejjohnson/radtrax", tag = "v0.1.0" }
geophysix = { git = "https://github.com/jejjohnson/geophysix", tag = "v0.0.7" }
integrix = { git = "https://github.com/jejjohnson/integrix", tag = "v0.0.6" }
kernellib = { git = "https://github.com/jejjohnson/kernellib", tag = "v0.0.22" }
pyrox-xtreme = { git = "https://github.com/jejjohnson/pyrox", subdirectory = "packages/pyrox-xtreme", rev = "05e38f84305374a68700c06c834b99546bddc64c" }
geonnax = { git = "https://github.com/jejjohnson/geonnax", tag = "v0.0.10" }
# vardax v0.3.6 and vardax#307 (main at 3bc3457, not in a release yet), which
# pins pipekit at the tag above. It keeps
# MinimiseResult.converged (FourDVarResult.converged reports it) and the
# state-space form of OptimalInterpolation (coupled.fuse_observations solves
# with it).
vardax = { git = "https://github.com/jejjohnson/vardax", rev = "3bc3457bd285d8a68311eca5ba0926559546f490" }
# argminax v0.0.4 (the `assim` extra): the first release with
# argminax.curvature.Laplace, which the 4D-Var Laplace posterior is built as.
argminax = { git = "https://github.com/jejjohnson/argminax", tag = "v0.0.4" }
# The geotoolz packages (the `geo` and `io` extras) are pinned to one geotoolz
# commit, a02cebc on main: geoops 0.18.1 on pipekit-ops and the GeoArray
# carrier, geoarray beside it, and the xarray lane moved in from xrtoolz
# (xrops 0.5.1, xrproducts 0.5.0), which has no release from geotoolz yet. The
# commit carries the plume-product openers (geotoolz#744) and the EMIT QA
# presets (geotoolz#747) that `obs.load_emit_plume_complex` uses. functax is geoarray's own git dependency; plumax
# holds it on v0.0.11, the tag integrix v0.0.6 pins.
geotoolz-ops = { git = "https://github.com/jejjohnson/geotoolz", subdirectory = "packages/geotoolz-ops", rev = "a02cebcbf1e57ff205507b8bd0f9687f6fc4184c" }
geotoolz-array = { git = "https://github.com/jejjohnson/geotoolz", subdirectory = "packages/geotoolz-array", rev = "a02cebcbf1e57ff205507b8bd0f9687f6fc4184c" }
xrtoolz-ops = { git = "https://github.com/jejjohnson/geotoolz", subdirectory = "packages/xrtoolz-ops", rev = "a02cebcbf1e57ff205507b8bd0f9687f6fc4184c" }
xrtoolz-products = { git = "https://github.com/jejjohnson/geotoolz", subdirectory = "packages/xrtoolz-products", rev = "a02cebcbf1e57ff205507b8bd0f9687f6fc4184c" }
functax = { git = "https://github.com/jejjohnson/functax", tag = "v0.0.11" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.5",
    "pre-commit>=4.5.1",
    "numpyro>=0.21",
    # pipekit-cycle is a *test-only* dep: the adapters satisfy its protocols
    # structurally, and the tests assert that conformance via isinstance.
    "pipekit-cycle",
    # Runtime jaxtyping checks (tests/conftest.py) and property-based tests.
    "beartype>=0.22",
    "hypothesis>=6.100",
    # The `io` extra's readers, so the loader tests run in CI (which syncs
    # only this group).
    "xrtoolz-ops",
    "xrtoolz-products",
    # The `assim` extra, so the vardax inversion tests run in CI.
    "argminax",
    "vardax",
    # The `emulate` extra, so the footprint-emulator training tests run in CI.
    "pipekit-train[equinox,cache]",
    # The `population` extra, so the pyrox-xtreme-backed Tier V tests run in CI.
    "pyrox-xtreme",
    # The `geo` extra, so the plumax.geo tests run in CI.
    "georeader-spaceml>=2.4.1",
    "geotoolz-ops[morph]",
    "scikit-learn>=1.4",
    "tqdm>=4",
]
lint = [
    "ruff>=0.15.10",
]
typecheck = [
    "ty>=0.0.30",
]
docs = [
    # The prose half of the site is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. See docs/README.md.
    # MkDocs here builds only the API reference, whose `objects.inv` is what
    # lets the MyST prose cross-reference into it.
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    # pygments 2.20.0 + pymdownx crash on code fences containing blank lines
    # inside docstrings (html.escape on a None filename); 2.19.x is fine.
    "pygments<2.22",
    "mkdocstrings[python]>=1.0.4",
    "jupytext>=1.16",
    "ipykernel>=7.2.0",
    # Executes notebooks for docs/notebooks (see the docs-examples instructions).
    "nbconvert>=7.16.6",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.10",
    "watermark>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plumax"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",
    "E721",
    "E731",
    "E741",
    # `ruff format` already enforces the 88-col limit on code; the remaining
    # E501s are dense docstring / comment lines carrying equations and physical
    # units that shouldn't be hard-wrapped mid-formula.
    "E501",
    # jaxtyping shape annotations (Float[Array, "N 3"]) read as forward refs.
    "F722",
    "F821",
    # Ambiguous-unicode rules: the models use Greek / math glyphs (σ, ν, Δ, ×)
    # in docstrings, comments and strings on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export the public API surface.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

# ty (preview) does not yet model JAX array semantics or jaxtyping shape
# annotations: it infers `jnp` results as Python scalars (→ not-subscriptable),
# reads jaxtyping dimension names as undefined references, can't see optional
# extras such as `hapi`, and narrows `xarray`/`numpy` unions too aggressively.
# The full pytest suite is the real correctness gate; these systematically
# false-positive rules are downgraded until ty's JAX support matures.
[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unresolved-reference = "ignore"
unsupported-operator = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not validation'"
markers = [
    "slow: deterministic and over about 2 s (solves, compiles of a large model, long simulations); skipped by default, run with -m slow, or -m 'not validation' for fast and slow. An unmarked test must stay under the budget CI sets in PLUMAX_FAST_BUDGET",
    "validation: statistical (coverage, recovery under MCMC, Monte Carlo tolerances) or too long for every PR; skipped by default, runs nightly on main and on workflow_dispatch, run with -m validation, or -m '' for everything",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src/plumax"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
