name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every PR, stacked ones included.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run fast tests
        run: uv run pytest -n 4 --dist loadfile --durations=15

  # PRs into main run Python 3.12; pushes to main run both versions.
  # Two workers: at -n 4 the suite exceeded the runner's memory.
  full:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12", "3.13"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run fast and slow tests with coverage
        run: uv run pytest -n 2 --dist loadfile -m "not validation" --durations=15 --cov=src/plumax --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
