# ---------------------------------------------------------------------------
# MkDocs builds ONLY the API reference, which is deployed as the `/reference/`
# subtree of the MyST site. Prose, design docs, and theory pages are built by
# mystmd from `docs/myst.yml`. See `docs/README.md` for the split and the
# rationale.
#
# mkdocstrings publishes a Sphinx-compatible `objects.inv` into `site/`, and
# that inventory is what lets the MyST prose cross-reference into these pages.
# ---------------------------------------------------------------------------
site_name: plumax API reference
site_description: API reference for plumax — generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/plumax
repo_name: jejjohnson/plumax

docs_dir: docs/api
site_dir: site

# The prose pages live in the MyST half of the site, so links to them point
# outside `docs_dir` by design. The assembled-site link checker in
# `scripts/build_docs.py` validates them instead — across both halves, which
# neither tool can do on its own.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            heading_level: 2
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Tier 0 — Meteorology: met.md
  - Tier 0 — Observations: obs.md
  - Tier 0 — Priors: priors.md
  - Tier I — Gaussian:
      - Gaussian plume: gauss_plume.md
      - Plume rise: gauss_plume_plume_rise.md
      - Column observation: gauss_plume_observation.md
      - Likelihoods: gauss_plume_likelihoods.md
      - Multi-source: gauss_plume_multi_source.md
      - Gaussian puff: gauss_puff.md
  - Tier II — Lagrangian:
      - Lagrangian particles: lagrangian.md
      - Gridded wind: lagrangian_wind_interp.md
      - Met ensemble: lagrangian_met_ensemble.md
  - Tier III — Eulerian FV: les_fvm.md
  - Tier IV — Coupled: coupled.md
  - Tier V — Population: population.md
  - Plume vetting: vetting.md
  - Plume operators (geo): geo.md
  - pipekit integration:
      - Operators: operators.md
      - Adapters: adapters.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
