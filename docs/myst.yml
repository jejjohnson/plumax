# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: home page, design
# roadmap, and theory pages. The API reference is built separately by MkDocs
# + mkdocstrings and mounted at `/reference/`. See `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s) — a filesystem path is rejected and a
# `file://` URL is silently ignored. `scripts/build_docs.py` serves the freshly
# built MkDocs `site/` on this exact port, then rewrites the resulting
# localhost URLs to the deployed `/reference/` path. Keep the port in sync
# with API_PORT in that script.
# ---------------------------------------------------------------------------
version: 1

project:
  id: plumax-docs
  title: plumax
  description: >-
    Differentiable, probabilistic atmospheric plume dispersion and methane
    retrieval models, built on JAX.
  github: https://github.com/jejjohnson/plumax
  authors:
    - name: J. Emmanuel Johnson
  references:
    api: http://127.0.0.1:8910/
  # Hover tooltips wherever these appear in the prose.
  abbreviations:
    CRM: Completely random measure
    CRMs: Completely random measures
    GGP: Generalised Gamma process
    LGCP: Log-Gaussian Cox process
    IBP: Indian Buffet Process
    IME: Integrated mass enhancement
    POD: Probability of detection
    TMTPP: Thinned marked temporal point process
    SDE: Stochastic differential equation
    SDEs: Stochastic differential equations
    ppb: Parts per billion
  toc:
    - file: index.md
    - title: Design
      children:
        - file: design/roadmap.md
        - file: design/00_prerequisites.md
        - file: design/01_tier1_gaussian.md
        - file: design/02_tier2_lagrangian.md
        - file: design/03_tier3_eulerian.md
        - file: design/04_rtm_stack.md
        - file: design/05_tier4_coupled.md
        - file: design/06_tier5_population.md
          children:
            - file: design/06_tier5a_instantaneous.md
            - file: design/06_tier5b_point_process.md
            - file: design/06_tier5c_persistency.md
            - file: design/06_tier5d_total_emission.md
    - title: Theory
      children:
        - file: theory/inventory/inventory.md
          children:
            - file: theory/inventory/01_inventory_problem.md
            - file: theory/inventory/02_inventory_objects.md
            - file: theory/inventory/03_inventory_phases.md
    - title: Project
      children:
        - file: changelog.md

site:
  title: plumax
  template: book-theme
  options:
    logo_text: plumax
  # mystmd requires a full URL here (both `/reference/` and `reference/` are
  # rejected), so the deployed location is hard-coded the way `repo_url` is in
  # mkdocs.yml.
  #
  # Do NOT rewrite this to a root-relative path at build time. The theme
  # re-renders the nav from this config on hydration and prepends BASE_URL to
  # any URL starting with `/`, so a rewritten value becomes
  # `/plumax/plumax/reference/` and 404s. An absolute URL is treated as
  # external and left alone. The cost is that a local preview's nav button
  # points at the deployed site.
  nav:
    - title: API reference
      url: https://jejjohnson.github.io/plumax/reference/
